<section id="shopCart">
        <div class="cart-content">
            <div class="cart-title">
                <button type="button" class="back-btn"><img src="../Icons/arrow-left.png" width="20px" height="auto"></button>

                <img src="../Icons/green cart.png" width="70px" height="auto">
                <div class="cart-head">
                    <h2>Your Shopping Cart</h2>
                    <p>Review your <span>order</span></p>
                </div>
                
            </div>
            <div class="cart-self">

                <div class="empty-shop">
                    <p>You haven't added any items yet!</p>
                    <img src="../Icons/empty cart.png" id="human">
                    <img src="../Icons/red.png" id="red">
                </div>

                <div class="fill-shop">
                      <div class="shop-food-title">
                            <p>Food</p>
                            <p>Price</p>
                            <p>Quantity</p>
                            <p>Total</p>
                      </div>
                     <div class="shop-food">
                       

                     </div>

                    <div class="checkout">
                       <p id="totalCart">Total price: <span>0</span>$</p> 
                       <button type="button" id="checkoutBtn">Check out<img src="../Icons/circle-check-big.png" width="22px"></button>
                   </div>

                </div>
               
            </div>
        </div>
</section>
